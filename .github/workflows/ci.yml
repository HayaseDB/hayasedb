name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  build:
    name: Lint, types & build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          cache-key: build

      - name: Check formatting
        run: bun run format:check

      - name: Lint, check types and build
        run: bunx turbo run lint check-types build

      - name: Verify migration history
        run: bun --filter @hayasedb/db db:check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          cache-key: unit

      - name: Build packages and prepare Nuxt layers
        run: |
          bunx turbo run build --filter='./packages/*'
          bunx turbo run prepare --filter='./packages/*' --filter='./apps/*'

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          cache-key: integration

      - name: Run integration tests
        run: bunx turbo run test:integration --filter=@hayasedb/api --filter=@hayasedb/db

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hayase
          POSTGRES_PASSWORD: hayase
          POSTGRES_DB: hayasedb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hayase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      POSTGRES_USER: hayase
      POSTGRES_PASSWORD: hayase
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up workspace
        uses: ./.github/actions/setup
        with:
          cache-key: e2e

      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run end-to-end tests
        run: bunx turbo run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
