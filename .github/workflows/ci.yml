name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-ci-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-ci-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint, check types, build
        run: bunx turbo run lint check-types build

      - name: Check migration history
        run: bun --filter @hayasedb/db db:check

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-unit-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ runner.os }}-
            turbo-ci-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages and prepare Nuxt layers
        run: |
          bunx turbo run build --filter='./packages/*'
          bunx turbo run prepare --filter='./packages/*' --filter='./apps/*'

      - name: Unit tests with coverage
        run: bun run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-integration-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-integration-${{ runner.os }}-
            turbo-ci-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integration tests
        run: bunx turbo run test:integration --filter=@hayasedb/api --filter=@hayasedb/db

  e2e:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hayase
          POSTGRES_PASSWORD: hayase
          POSTGRES_DB: hayasedb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hayase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      POSTGRES_USER: hayase
      POSTGRES_PASSWORD: hayase
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      MINIO_ACCESS_KEY: minio-e2e
      MINIO_SECRET_KEY: minio-e2e-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-ci-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: ./node_modules/.bin/playwright install chromium

      - name: Install Chromium system dependencies
        working-directory: e2e
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --health-cmd "mc ready local" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            minio/minio:RELEASE.2025-04-08T15-41-24Z server /data
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' minio)" = healthy ] && exit 0
            [ "$(docker inspect -f '{{.State.Status}}' minio)" = running ] || break
            sleep 2
          done
          docker logs minio
          exit 1

      - name: End-to-end tests
        run: bunx turbo run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
