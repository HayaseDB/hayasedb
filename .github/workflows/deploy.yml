name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: >
          Deploy to production even if this commit carries no new release tag.
          Use to recover a release whose pipeline failed after tagging.
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version or tag release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run version
          publish-script: bun run tag
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release state
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./apps/api/package.json').version")"
          tag="@hayasedb/api@${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [ -n "$(git tag --list "${tag}")" ] \
            && [ "$(git rev-list -n1 "${tag}")" = "${GITHUB_SHA}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${version} is tagged at this commit; releasing."
          elif [ "${FORCE_RELEASE}" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Forced release of ${version} without a matching tag at this commit."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release tag at this commit; staging only."
          fi

      - name: Publish GitHub releases
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -uo pipefail

          failed=0
          for tag in $(git tag --points-at "${GITHUB_SHA}" | grep -F "@${VERSION}" || true); do
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} already exists; skipping."
              continue
            fi

            for attempt in 1 2 3 4 5; do
              if gh release create "${tag}" --title "${tag}" \
                --notes "See CHANGELOG.md for details." --verify-tag; then
                echo "Created release ${tag}."
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::warning::Could not create release ${tag} after 5 attempts."
                failed=1
                break
              fi
              sleep $((attempt * 5))
            done
            sleep 1
          done

          if [ "${failed}" -eq 1 ]; then
            echo "::warning::Some GitHub releases were not created. Deployment continues; re-run this job to retry them."
          fi

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ghcr.io/hayasedb/hayasedb-${{ matrix.app }}
          tags: |
            type=raw,value=dev
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/hayasedb/hayasedb-${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Trigger Portainer redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set for this environment."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --max-time 60 \
            -X POST "${WEBHOOK_URL}"

  retag:
    needs: [version, images]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag images for release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          for app in api web admin; do
            image="ghcr.io/hayasedb/hayasedb-${app}"
            source="${image}:sha-${GITHUB_SHA}"

            if ! docker buildx imagetools inspect "${source}" >/dev/null 2>&1; then
              echo "::error::${source} is missing from the registry."
              echo "::error::Re-run the 'images' job for this commit before retrying."
              exit 1
            fi

            for attempt in 1 2 3; do
              if docker buildx imagetools create \
                --tag "${image}:${VERSION}" \
                --tag "${image}:latest" \
                "${source}"; then
                echo "Retagged ${app} as ${VERSION} and latest."
                break
              fi
              if [ "${attempt}" -eq 3 ]; then
                echo "::error::Failed to retag ${app} after 3 attempts."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

  deploy-production:
    needs: [version, retag]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Trigger Portainer redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set for this environment."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
            --max-time 60 \
            -X POST "${WEBHOOK_URL}"
