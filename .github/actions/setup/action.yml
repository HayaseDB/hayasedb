name: Setup workspace
description: Check out toolchain, restore Bun and Turbo caches, and install dependencies.

inputs:
  cache-key:
    description: Job-scoped suffix for the Turbo cache key, so jobs do not overwrite each other.
    required: true
  install:
    description: Whether to run bun install.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Restore Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Restore Turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ inputs.cache-key }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ inputs.cache-key }}-${{ runner.os }}-
          turbo-build-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
